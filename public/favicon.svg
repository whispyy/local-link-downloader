<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Cyan download arrow — tip lands exactly on the house roof peak -->
  <rect x="232" y="52" width="48" height="156" rx="24" fill="#22d3ee"/>
  <path d="M 130 192 L 256 306 L 382 192 Z" fill="#22d3ee"/>

  <!-- House outline — roof peak aligns with the arrow tip -->
  <path d="M 80 402 L 256 306 L 432 402 L 432 456 L 80 456 Z"
        fill="none" stroke="white" stroke-width="28"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
